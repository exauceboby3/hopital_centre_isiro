name: Appliquer la version clinique finale

on:
  push:
    branches:
      - automation/final-clinical-workflow-20260729
    paths:
      - '.github/workflows/apply-final-clinical-workflow.yml'

permissions:
  contents: write

jobs:
  apply-final-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer la branche d'automatisation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruire et verifier le correctif
        shell: bash
        run: |
          cat .automation/final-clinical-workflow/part-* | base64 --decode > /tmp/final-clinical-workflow.patch
          test -s /tmp/final-clinical-workflow.patch
          echo "fbecd82a3d288d7ece779504e3780d97d264a608dce95a4a6544204c459b9b22  /tmp/final-clinical-workflow.patch" | sha256sum --check

      - name: Appliquer sur main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git apply --check /tmp/final-clinical-workflow.patch
          git apply /tmp/final-clinical-workflow.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corriger les notifications et finaliser le parcours clinique"
          git push origin main
