name: Appliquer et valider les transferts médicaux avancés

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: advanced-doctor-transfer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hopital_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hopital_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopital_ci
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_TELEMETRY_DISABLED: 1
      HOSPITAL_UTC_OFFSET_MINUTES: 120
      SEED_SUPER_ADMIN_USERNAME: ci-superadmin
      SEED_SUPER_ADMIN_PASSWORD: ci-only-strong-password

    steps:
      - name: Récupérer la branche isolée
        uses: actions/checkout@v4
        with:
          ref: agent/advanced-doctor-transfer-tests-20260802
          fetch-depth: 0

      - name: Déterminer si le correctif est déjà appliqué
        id: state
        shell: bash
        run: |
          if test -f scripts/simulate-advanced-doctor-workflows.mjs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Node.js 22
        if: steps.state.outputs.applied != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruire et vérifier le correctif
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/advanced-transfer-patch/part-*.txt | tr -d '\r\n' > /tmp/advanced-transfer.patch.gz.b64
          base64 --decode /tmp/advanced-transfer.patch.gz.b64 > /tmp/advanced-transfer.patch.gz
          echo '027dc3c7bc7f809d21a6e1665ce6689551f8c615ca0e6af682ae686989d85021  /tmp/advanced-transfer.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/advanced-transfer.patch.gz > /tmp/advanced-transfer.patch
          echo 'f2ddf933775a3a07d69dfa78b5abbc26b523be4c6d64c58000b4511888ca5d86  /tmp/advanced-transfer.patch' | sha256sum --check
          git apply --check /tmp/advanced-transfer.patch
          git apply --index /tmp/advanced-transfer.patch
          git diff --cached --check

      - name: Installer les dépendances
        if: steps.state.outputs.applied != 'true'
        run: |
          npm install --global npm@11
          npm ci

      - name: Préparer PostgreSQL et Prisma
        if: steps.state.outputs.applied != 'true'
        run: |
          npm run db:generate
          npm exec --workspace @hopital/api prisma validate
          npm run db:deploy
          npm run db:seed

      - name: Vérifier les invariants sources
        if: steps.state.outputs.applied != 'true'
        run: npm run check:source

      - name: Exécuter le lint
        if: steps.state.outputs.applied != 'true'
        run: npm run lint

      - name: Exécuter tous les tests API et frontend
        if: steps.state.outputs.applied != 'true'
        run: npm test

      - name: Construire NestJS et Next.js
        if: steps.state.outputs.applied != 'true'
        run: npm run build

      - name: Exécuter les deux campagnes de parcours patients
        if: steps.state.outputs.applied != 'true'
        run: npm run test:all-workflows

      - name: Publier les rapports de test
        if: steps.state.outputs.applied != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-transferts-medicaux-avances
          path: |
            artifacts/20-patient-workflow-report.json
            artifacts/advanced-doctor-load-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier le code validé sur la branche
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/advanced-doctor-load-report.json
          test "$(jq -r '.failedAssertions' artifacts/advanced-doctor-load-report.json)" = "0"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Tester la charge médicale et sécuriser les transferts'
          git push origin HEAD:agent/advanced-doctor-transfer-tests-20260802

      - name: Confirmer la version déjà appliquée
        if: steps.state.outputs.applied == 'true'
        run: echo 'Le correctif avancé est déjà présent sur la branche.'
