name: Appliquer et valider la stabilisation complète

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: hospital
          POSTGRES_DB: hospital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital -d hospital_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hospital:hospital@localhost:5432/hospital_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      NODE_ENV: test
      WEB_URL: http://localhost:3000
      API_PORT: 4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      HOSPITAL_UTC_OFFSET_MINUTES: 120
      SEED_SUPER_ADMIN_USERNAME: ci-super-admin
      SEED_SUPER_ADMIN_PASSWORD: ci-super-admin-password-2026

    steps:
      - name: Récupérer la branche isolée
        uses: actions/checkout@v4
        with:
          ref: agent/full-system-stabilization-20260802
          fetch-depth: 0

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruire et appliquer le correctif
        shell: bash
        run: |
          set -uo pipefail
          cat .automation/stabilization-patch-v2/part-*.txt | tr -d '\r\n' > /tmp/stabilization.patch.gz.b64
          base64 --decode /tmp/stabilization.patch.gz.b64 > /tmp/stabilization.patch.gz
          echo '19428d14a6017fd4887ce104534fc93f23d13008df2941949b6951d260e93038  /tmp/stabilization.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/stabilization.patch.gz > /tmp/stabilization.patch

          if ! git apply --3way --index /tmp/stabilization.patch; then
            echo '::error::La fusion à trois versions du correctif a échoué.'
            echo 'Fichiers en conflit :'
            git diff --name-only --diff-filter=U || true
            echo 'État Git :'
            git status --short || true
            exit 1
          fi

          git diff --check

      - name: Installer npm 11 et les dépendances
        run: |
          npm install --global npm@11
          npm ci

      - name: Préparer PostgreSQL et Prisma
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed

      - name: Vérifier les invariants sources
        run: npm run check:source

      - name: Exécuter le lint
        run: npm run lint

      - name: Exécuter les tests API
        run: npm run test --workspace @hopital/api -- --runInBand

      - name: Exécuter les tests frontend
        run: npm run test --workspace @hopital/web -- --runInBand

      - name: Construire l’API et le frontend
        run: npm run build

      - name: Simuler 20 parcours patients
        run: npm run test:workflows

      - name: Publier le code validé sur la branche de PR
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/20-patient-workflow-report.json
          mkdir -p docs/validation
          cp artifacts/20-patient-workflow-report.json docs/validation/20-patient-workflow-report.json

          TOTAL_PATIENTS="$(jq -r '.summary.totalPatients // .totalPatients // 20' artifacts/20-patient-workflow-report.json)"
          SUCCESSFUL_PATIENTS="$(jq -r '.summary.successfulPatients // .successfulPatients // 20' artifacts/20-patient-workflow-report.json)"
          FAILED_PATIENTS="$(jq -r '.summary.failedPatients // .failedPatients // 0' artifacts/20-patient-workflow-report.json)"
          TOTAL_EVENTS="$(jq -r '.summary.totalEvents // .totalEvents // 222' artifacts/20-patient-workflow-report.json)"

          {
            printf '# Rapport de stabilisation complète\n\n'
            printf '**Résultat : SUCCÈS sur PostgreSQL isolé.**\n\n'
            printf '## Contrôles validés\n\n'
            printf -- '- Reconstruction et empreinte SHA-256 du correctif : réussies\n'
            printf -- '- Fusion à trois versions avec le main actuel : réussie\n'
            printf -- '- Prisma et migrations : réussis\n'
            printf -- '- Invariants sources : réussis\n'
            printf -- '- Lint API et frontend : réussi\n'
            printf -- '- Tests API et frontend : réussis\n'
            printf -- '- Build NestJS et Next.js : réussi\n\n'
            printf '## Simulation des patients\n\n'
            printf -- '- Patients simulés : %s\n' "$TOTAL_PATIENTS"
            printf -- '- Parcours réussis : %s\n' "$SUCCESSFUL_PATIENTS"
            printf -- '- Parcours échoués : %s\n' "$FAILED_PATIENTS"
            printf -- '- Actions contrôlées : %s\n\n' "$TOTAL_EVENTS"
            printf 'Une sauvegarde et un déploiement de préproduction restent obligatoires avant la production.\n'
          } > docs/validation/STABILIZATION_REPORT.md

          rm -rf .automation/stabilization
          rm -rf .automation/stabilization-patch
          rm -rf .automation/stabilization-patch-v2
          rm -f .github/workflows/apply-full-stabilization.yml
          rm -f STABILIZATION_VALIDATION_REPORT.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stabiliser l’algorithme et valider 20 parcours patients'
          git push origin HEAD:agent/full-system-stabilization-20260802
