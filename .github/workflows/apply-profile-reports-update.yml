name: Appliquer et valider profils rapports RH

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: profile-reports-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hopital_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hopital_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopital_ci
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_TELEMETRY_DISABLED: 1
      HOSPITAL_UTC_OFFSET_MINUTES: 120
      SEED_SUPER_ADMIN_USERNAME: ci-superadmin
      SEED_SUPER_ADMIN_PASSWORD: ci-only-strong-password

    steps:
      - name: Récupérer la branche isolée
        uses: actions/checkout@v4
        with:
          ref: agent/profiles-records-reports-rh-20260802
          fetch-depth: 0

      - name: Déterminer si le correctif est déjà appliqué
        id: state
        shell: bash
        run: |
          if test -f apps/api/prisma/migrations/20260802143000_add_profiles_reports_requisitions_hr/migration.sql; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruire et vérifier le correctif
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/profile-reports-v1/part-*.txt | tr -d '\r\n' > /tmp/profile-reports.patch.gz.b64
          sed -i 's|h7CYZ/b7t99oIYT18oMTwTImDHuwbO777P2N|h7CYZ/b7t99oIYT18oMTwTImDHuwbO977P2N|' /tmp/profile-reports.patch.gz.b64
          echo 'e9a2560bdc2c39b0305675b5c6d75b3abb79fa31b804ea52c6b27892d1832ee8  /tmp/profile-reports.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/profile-reports.patch.gz.b64 > /tmp/profile-reports.patch.gz
          echo '43034b56fcaebdc0b762bdd9cb7d1316a9aa0faeb30be470c0047186cb7e9cfb  /tmp/profile-reports.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/profile-reports.patch.gz > /tmp/profile-reports.patch
          echo '2c19acf5d1d8054b8c3d4b1f18b685d2e983824006d7a57b03e96541ac5a985b  /tmp/profile-reports.patch' | sha256sum --check
          git apply --check /tmp/profile-reports.patch
          git apply --index /tmp/profile-reports.patch
          echo '8a61b9b64af0355a14449b824e53555ff40181de8d2933e9c96f7e74c34e27cd  .automation/profile-reports-v1/lint-test-fix.patch' | sha256sum --check
          git apply --check .automation/profile-reports-v1/lint-test-fix.patch
          git apply --index .automation/profile-reports-v1/lint-test-fix.patch
          echo '91e028d7f6a29a41b905d2d850b0018990346f228c15e1c3a30b39204f85dd33  .automation/profile-reports-v1/typescript-code-fix.patch' | sha256sum --check
          git apply --check .automation/profile-reports-v1/typescript-code-fix.patch
          git apply --index .automation/profile-reports-v1/typescript-code-fix.patch
          git diff --cached --check

      - name: Installer Node.js 22
        if: steps.state.outputs.applied != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer npm 11 et les dépendances
        if: steps.state.outputs.applied != 'true'
        run: |
          npm install --global npm@11
          npm ci

      - name: Préparer PostgreSQL et Prisma
        if: steps.state.outputs.applied != 'true'
        run: |
          npm run db:generate
          npm exec --workspace @hopital/api prisma validate
          npm run db:deploy
          npm run db:seed

      - name: Vérifier les invariants sources
        if: steps.state.outputs.applied != 'true'
        run: npm run check:source

      - name: Exécuter le lint
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Exécuter tous les tests API et frontend
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Construire NestJS et Next.js
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Exécuter les campagnes de parcours
        if: steps.state.outputs.applied != 'true'
        run: npm run test:all-workflows

      - name: Publier les rapports et diagnostics
        if: steps.state.outputs.applied != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-profils-dossiers-services-rh
          path: |
            artifacts/20-patient-workflow-report.json
            artifacts/advanced-doctor-load-report.json
            artifacts/department-profile-workflow-report.json
            lint.log
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier uniquement le code métier validé
        if: steps.state.outputs.applied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/department-profile-workflow-report.json
          test "$(jq -r '.failedAssertions' artifacts/department-profile-workflow-report.json)" = "0"
          git reset
          git add apps package.json scripts docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ajouter les profils, dossiers, rapports et ressources humaines'
          git push origin HEAD:agent/profiles-records-reports-rh-20260802

      - name: Confirmer la version déjà appliquée
        if: steps.state.outputs.applied == 'true'
        run: echo 'Le correctif métier est déjà présent sur la branche.'
