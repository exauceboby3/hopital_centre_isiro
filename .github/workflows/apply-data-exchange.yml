name: Appliquer et valider les échanges de données

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-data-exchange-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/full-data-exchange-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hopital_exchange_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hopital_exchange_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hopital_exchange_ci
      JWT_ACCESS_SECRET: exchange-ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: exchange-ci-refresh-secret-with-at-least-32-characters
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_TELEMETRY_DISABLED: 1
      HOSPITAL_UTC_OFFSET_MINUTES: 120
      SEED_SUPER_ADMIN_USERNAME: exchange-superadmin
      SEED_SUPER_ADMIN_PASSWORD: exchange-only-strong-password

    steps:
      - name: Récupérer la branche de la PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruire, corriger et vérifier le paquet
        shell: bash
        run: |
          set -euo pipefail
          cat _automation/data-exchange/part-* > data_exchange_bundle.b64
          base64 --decode data_exchange_bundle.b64 > data_exchange_bundle.tar.gz
          echo "69fef7a7155e15d3c7c2a9e64cebe2cbe58d8eb26ae690874623ea4de3863cf9  data_exchange_bundle.tar.gz" | sha256sum --check
          tar --extract --gzip --file data_exchange_bundle.tar.gz
          python _automation/data-exchange/apply-lint-fix.py
          rm -rf _automation/data-exchange data_exchange_bundle.b64 data_exchange_bundle.tar.gz

      - name: Installer Node.js et npm 11
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer le monorepo complet
        shell: bash
        run: |
          npm install --global npm@11
          npm ci

      - name: Générer Prisma et préparer PostgreSQL
        run: |
          npm run db:generate
          npm exec --workspace @hopital/api prisma validate
          npm run db:deploy
          npm run db:seed

      - name: Vérifier le code et les scénarios
        shell: bash
        run: |
          set -o pipefail
          npm run check:source
          npm run lint 2>&1 | tee data-exchange-lint.log
          npm test 2>&1 | tee data-exchange-test.log
          npm run build 2>&1 | tee data-exchange-build.log
          npm run test:all-workflows

      - name: Publier le code validé sur la branche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps scripts docs
          if git diff --cached --quiet; then
            echo "Aucun changement métier à publier."
            exit 0
          fi
          git commit -m "Ajouter les exports PDF Excel CSV et les imports contrôlés"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Conserver les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-echanges-donnees
          path: |
            data-exchange-lint.log
            data-exchange-test.log
            data-exchange-build.log
            artifacts/data-exchange-workflow-report.json
          if-no-files-found: ignore
          retention-days: 7
