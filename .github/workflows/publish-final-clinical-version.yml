name: Publier la version clinique finale

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish-final-version:
    if: github.event.issue.title == '[AUTOMATION] Publier version clinique finale'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruire et vérifier le correctif
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BRANCH='automation/final-clinical-workflow-20260729'
          SOURCE_DIR='.automation/final-clinical-workflow'
          git fetch origin "$SOURCE_BRANCH"
          mapfile -t PARTS < <(git ls-tree -r --name-only "origin/$SOURCE_BRANCH" "$SOURCE_DIR" | sort)
          test "${#PARTS[@]}" -eq 17
          : > /tmp/final-clinical-workflow.b64
          for part in "${PARTS[@]}"; do
            git show "origin/$SOURCE_BRANCH:$part" >> /tmp/final-clinical-workflow.b64
          done
          base64 --decode /tmp/final-clinical-workflow.b64 > /tmp/final-clinical-workflow.patch
          test -s /tmp/final-clinical-workflow.patch
          echo 'fbecd82a3d288d7ece779504e3780d97d264a608dce95a4a6544204c459b9b22  /tmp/final-clinical-workflow.patch' | sha256sum --check

      - name: Appliquer et publier sur main
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/final-clinical-workflow.patch
          git apply /tmp/final-clinical-workflow.patch
          git diff --check
          git rm .github/workflows/publish-final-clinical-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corriger les notifications et finaliser le parcours clinique'
          git push origin main

      - name: Fermer la demande technique
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Version clinique finale publiée sur main."
