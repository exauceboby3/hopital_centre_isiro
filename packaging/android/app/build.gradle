plugins {
    id 'com.android.application'
}

android {
    namespace 'cd.isiro.hopital'
    compileSdk 35

    defaultConfig {
        applicationId 'cd.isiro.hopital'
        minSdk 24
        targetSdk 35
        versionCode 20000
        versionName '2.0.0'
        buildConfigField 'String', 'HOSPITAL_URL', '"https://hopitalcentreisiro.online"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
