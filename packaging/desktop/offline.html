<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHI Isiro — Connexion indisponible</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #17212b; background: #f4f7f8; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid #dfe7e5; border-radius: 22px; background: white; box-shadow: 0 18px 50px rgba(25,54,61,.1); }
    .mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; color: white; background: #087b68; font-size: 24px; font-weight: 900; }
    h1 { margin: 22px 0 8px; font-size: 1.55rem; }
    p { color: #687784; line-height: 1.6; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 12px; color: white; background: #087b68; cursor: pointer; font: inherit; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="mark">CHI</div>
    <h1>Serveur momentanément inaccessible</h1>
    <p>Vérifiez la connexion Internet ou le réseau de l’hôpital, puis réessayez. Les données ne sont pas supprimées.</p>
    <button type="button" onclick="location.href='https://hopitalcentreisiro.online'">Réessayer</button>
  </main>
</body>
</html>
